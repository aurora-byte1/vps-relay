name: Ubuntu VPS Relay Node

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: 'Password for RDP user (runner)'
        required: true
        default: 'P@ssw0rd12345!'
        type: string
      enable_funnel:
        description: 'Expose service via Tailscale Funnel / Serve'
        required: true
        default: true
        type: boolean
      cycle_count:
        description: 'Relay cycle counter'
        required: false
        default: '0'
        type: string
      retry_depth:
        description: 'Pre-warming circuit breaker retry depth'
        required: false
        default: '0'
        type: string
      test_handover:
        description: 'Test mode: hand over after X minutes (0 for normal 330m)'
        required: false
        default: '0'
        type: string

jobs:
  vps-relay:
    name: Provision Ubuntu VPS Relay Node
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Current Repository
        uses: actions/checkout@v4

      # =====================================================================
      # PHASE 1: PRE-WARMING (Predecessor remains active and serving traffic)
      # =====================================================================
      - name: Install System RDP & Docker Dependencies
        id: prewarm
        env:
          RDP_PASS: ${{ github.event.inputs.rdp_password }}
          CLONE_PAT: ${{ secrets.CLONE_PAT }}
        run: |
          echo "=== PHASE 1: Pre-Warming System & Local Workload ==="
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xrdp xfce4 xfce4-goodies curl jq netcat-openbsd dnsutils

          # XRDP Environment Setup
          echo "xfce4-session" > ~/.xsession
          echo "export GNOME_SHELL_SESSION_MODE=ubuntu" >> ~/.xsessionrc
          echo "export XDG_CURRENT_DESKTOP=XFCE" >> ~/.xsessionrc
          printf '%s:%s\n' "runner" "$RDP_PASS" | sudo chpasswd
          sudo sed -i 's/allowed_users=console/allowed_users=anybody/' /etc/X11/Xwrapper.config 2>/dev/null || true
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

          # Clone Private Workload
          git config --global user.name "Silver-kun"
          git config --global user.email "silver-kun@users.noreply.github.com"
          rm -rf the-vps 2>/dev/null || true
          git clone --depth=1 "https://${CLONE_PAT}@github.com/Silver-kun/THE-VPS-SET-UP.git" the-vps

          # Launch AIStudioToAPI container safely
          (cd the-vps/AIStudioToAPI && (docker compose up -d --build || docker compose up -d))

          # Active Health Poll: localhost:7860/health (Timeout: 180s)
          echo "Polling AIStudioToAPI health endpoint..."
          WARM=false
          for i in {1..36}; do
            HEALTH_JSON=$(curl -s --connect-timeout 2 --max-time 3 http://localhost:7860/health 2>/dev/null || echo "")
            if echo "$HEALTH_JSON" | grep -q '"browserConnected":\s*true' || echo "$HEALTH_JSON" | grep -q '"status":\s*"ok"'; then
              echo "AIStudioToAPI verified 100% warm and operational in $((i * 5))s!"
              WARM=true
              break
            fi
            sleep 5
          done

          if [ "$WARM" != "true" ]; then
            echo "ERROR: Local service failed to warm up within 180s."
            exit 1
          fi

      # =====================================================================
      # CIRCUIT BREAKER: Dispatches next node if Phase 1 failed
      # =====================================================================
      - name: Circuit Breaker on Pre-Warming Failure
        if: failure() && steps.prewarm.outcome == 'failure'
        env:
          NEXT_PAT: ${{ secrets.NEXT_PAT }}
          FALLBACK_PAT: ${{ secrets.FALLBACK_PAT }}
          RDP_PASS: ${{ github.event.inputs.rdp_password }}
          ENABLE_FUNNEL: ${{ github.event.inputs.enable_funnel }}
          CYCLE_COUNT: ${{ github.event.inputs.cycle_count }}
          RETRY_DEPTH: ${{ github.event.inputs.retry_depth }}
          TEST_HANDOVER: ${{ github.event.inputs.test_handover }}
        run: |
          echo "=== CIRCUIT BREAKER TRIGGERED ==="
          echo "Pre-warming failed. Predecessor is untouched and still serving."

          DEPTH=${RETRY_DEPTH:-0}
          if [ "$DEPTH" -ge 2 ]; then
            echo "Max retry depth ($DEPTH) reached. Halting automatic failover to prevent ring loop."
            exit 1
          fi

          NEW_DEPTH=$((DEPTH + 1))
          echo "Executing fallback dispatch to next ring node with retry_depth=${NEW_DEPTH}..."

          REPOS=(
            "octo-drift/vps-relay"
            "pixel-forge6999/vps-relay"
            "void-runner1/vps-relay"
            "zenith-labs1/vps-relay"
            "aurora-byte1/vps-relay"
            "timber-code1/vps-relay"
          )
          CURRENT_INDEX=-1
          for i in "${!REPOS[@]}"; do
            if [ "${REPOS[$i]}" = "${GITHUB_REPOSITORY}" ]; then
              CURRENT_INDEX=$i
              break
            fi
          done
          [ $CURRENT_INDEX -eq -1 ] && CURRENT_INDEX=0

          NEXT_INDEX=$(( (CURRENT_INDEX + 1) % ${#REPOS[@]} ))
          FALLBACK_INDEX=$(( (CURRENT_INDEX + 2) % ${#REPOS[@]} ))
          PRIMARY_TARGET="${REPOS[$NEXT_INDEX]}"
          FALLBACK_TARGET="${REPOS[$FALLBACK_INDEX]}"

          sleep 30
          GH_TOKEN="$NEXT_PAT" gh workflow run rdp.yml \
            --repo "$PRIMARY_TARGET" \
            -f rdp_password="$RDP_PASS" \
            -f enable_funnel="$ENABLE_FUNNEL" \
            -f cycle_count="$CYCLE_COUNT" \
            -f retry_depth="$NEW_DEPTH" \
            -f test_handover="${TEST_HANDOVER:-0}" || \
          GH_TOKEN="$FALLBACK_PAT" gh workflow run rdp.yml \
            --repo "$FALLBACK_TARGET" \
            -f rdp_password="$RDP_PASS" \
            -f enable_funnel="$ENABLE_FUNNEL" \
            -f cycle_count="$CYCLE_COUNT" \
            -f retry_depth="$NEW_DEPTH" \
            -f test_handover="${TEST_HANDOVER:-0}" || true

          exit 1

      # =====================================================================
      # PHASE 2: HANDSHAKE & ACTIVE TAILNET EVICTION
      # =====================================================================
      - name: Handshake & Active Tailnet Eviction
        env:
          PREV_PAT: ${{ secrets.PREV_PAT }}
          TAILSCALE_API_KEY: ${{ secrets.TAILSCALE_API_KEY }}
        run: |
          echo "=== PHASE 2: Handshake & Active Tailnet Eviction ==="
          REPOS=(
            "octo-drift/vps-relay"
            "pixel-forge6999/vps-relay"
            "void-runner1/vps-relay"
            "zenith-labs1/vps-relay"
            "aurora-byte1/vps-relay"
            "timber-code1/vps-relay"
          )
          CURRENT_INDEX=-1
          for i in "${!REPOS[@]}"; do
            if [ "${REPOS[$i]}" = "${GITHUB_REPOSITORY}" ]; then
              CURRENT_INDEX=$i
              break
            fi
          done

          if [ $CURRENT_INDEX -ge 0 ]; then
            PREV_INDEX=$(( (CURRENT_INDEX - 1 + ${#REPOS[@]}) % ${#REPOS[@]} ))
            PREV_REPO="${REPOS[$PREV_INDEX]}"
            echo "Checking predecessor repo: ${PREV_REPO}..."

            PREV_RUN_ID=$(GH_TOKEN="$PREV_PAT" gh run list --repo "$PREV_REPO" \
              --json databaseId,status -q '.[] | select(.status=="in_progress" or .status=="queued") | .databaseId' 2>/dev/null | head -n 1 || echo "")

            if [ -n "$PREV_RUN_ID" ] && [ "$PREV_RUN_ID" != "null" ]; then
              echo "Cancelling predecessor run: #${PREV_RUN_ID} on ${PREV_REPO}..."
              GH_TOKEN="$PREV_PAT" gh run cancel "$PREV_RUN_ID" --repo "$PREV_REPO" 2>/dev/null || true

              # Await predecessor termination (up to 90s to allow auth token sync to finish)
              for sec in {1..30}; do
                RUN_STATUS=$(GH_TOKEN="$PREV_PAT" gh run view "$PREV_RUN_ID" --repo "$PREV_REPO" --json status -q '.status' 2>/dev/null || echo "")
                if [ "$RUN_STATUS" = "completed" ] || [ "$RUN_STATUS" = "cancelled" ]; then
                  echo "Predecessor cleanly terminated."
                  break
                fi
                sleep 3
              done
            fi
          fi

          # ACTIVE TAILNET EVICTION VIA BASIC AUTH API
          if [ -n "$TAILSCALE_API_KEY" ]; then
            echo "Executing Tailscale API device eviction for 'silver-trial'..."
            DEVICE_IDS=$(curl -sSL -u "${TAILSCALE_API_KEY}:" \
              "https://api.tailscale.com/api/v2/tailnet/-/devices" 2>/dev/null | \
              jq -r '.devices[]? | select(.hostname | test("^silver-trial(-[0-9]+)?$")) | .id' || true)

            for dev_id in $DEVICE_IDS; do
              if [ -n "$dev_id" ] && [ "$dev_id" != "null" ]; then
                echo "Evicting stale device ID: ${dev_id}..."
                curl -sSL -X DELETE -u "${TAILSCALE_API_KEY}:" \
                  "https://api.tailscale.com/api/v2/device/${dev_id}" 2>/dev/null || true
              fi
            done
            sleep 3
          else
            echo "TAILSCALE_API_KEY not provided; skipping API-based eviction."
          fi

      # =====================================================================
      # PHASE 3: ZERO-DOWNTIME TAILSCALE TAKEOVER
      # =====================================================================
      - name: Zero-Downtime Tailscale Takeover
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          STATE_B64: ${{ secrets.TAILSCALE_STATE_B64 }}
          ENABLE_FUNNEL: ${{ github.event.inputs.enable_funnel }}
        run: |
          echo "=== PHASE 3: Tailscale Claim & Routing Configuration ==="
          sudo mkdir -p --mode=0755 /usr/share/keyrings
          curl -fsSL https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg | sudo tee /usr/share/keyrings/tailscale-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu noble main" | sudo tee /etc/apt/sources.list.d/tailscale.list
          sudo apt-get update -qq
          sudo apt-get install -y --allow-downgrades tailscale=1.98.10 tailscale-archive-keyring || \
            sudo apt-get install -y --allow-downgrades tailscale=1.96.4 tailscale-archive-keyring || \
            (curl -fsSL https://tailscale.com/install.sh | sudo sh)

          sudo mkdir -p /var/run/tailscale /var/lib/tailscale/certs
          if [ -n "$STATE_B64" ]; then
            echo "Restoring permanent state & cached certificates..."
            echo "$STATE_B64" | base64 -d | sudo tar -xz -C /var/lib/tailscale/ 2>/dev/null || true
            sudo chmod 600 /var/lib/tailscale/tailscaled.state 2>/dev/null || true
            sudo chmod 600 /var/lib/tailscale/certs/*.key 2>/dev/null || true
            sudo chmod 644 /var/lib/tailscale/certs/*.crt 2>/dev/null || true
          fi

          sudo systemctl start tailscaled
          sudo tailscale up \
            --authkey="${TAILSCALE_AUTHKEY}" \
            --hostname="silver-trial" \
            --accept-routes \
            --reset

          # Ensure shields are down so Funnel ingress nodes can reach port 7860
          sudo tailscale set --shields-up=false

          echo "Tailscale active:"
          sudo tailscale status

          if [ "$ENABLE_FUNNEL" = "true" ] || [ "$ENABLE_FUNNEL" = true ]; then
            echo "Configuring Tailscale Serve & Funnel on pinned 1.98.10..."
            sudo tailscale serve reset 2>/dev/null || true
            sudo tailscale funnel reset 2>/dev/null || true

            # 1. Atomic Funnel configuration on standard HTTPS port 443
            sudo tailscale funnel --bg --https=443 http://localhost:7860

            # 2. Internal Tailnet-only mapping for port 7860 (Funnel strictly permits 443, 8443, 10000)
            sudo tailscale serve --bg --https=7860 http://localhost:7860 || true

            # 3. Apply single control-plane sync restart (Workaround for Tailscale Issue #19508)
            echo "Syncing Serve & Funnel configuration with Tailscale control plane..."
            sudo systemctl restart tailscaled

            # 4. Settle check: Wait for Tailscale daemon to report active Running state
            echo "Awaiting daemon stabilization..."
            for _ in $(seq 1 15); do
              if sudo tailscale status --json 2>/dev/null | grep -q '"BackendState":\s*"Running"'; then
                break
              fi
              sleep 1
            done

            echo "Current Funnel status:"
            sudo tailscale funnel status || true

            # 5. Robust multi-tier DNS resolution for Tailscale Anycast Edge IP
            PUBLIC_EDGE_IP=$(dig +short silver-trial.tail042f54.ts.net 2>/dev/null | grep -E '^[0-9.]+$' | head -n1 || \
                             dig +short silver-trial.tail042f54.ts.net @8.8.8.8 2>/dev/null | grep -E '^[0-9.]+$' | head -n1 || \
                             python3 -c "import socket; print(socket.gethostbyname('silver-trial.tail042f54.ts.net'))" 2>/dev/null | tr -d '[:space:]' || echo "")

            if [ -n "$PUBLIC_EDGE_IP" ]; then
              echo "Verifying external public edge ingress via Anycast IP ${PUBLIC_EDGE_IP}..."
              VERIFIED=false
              # Non-destructive polling loop: gives Anycast edge up to 60s to converge without restarting tailscaled
              for i in $(seq 1 12); do
                HTTP_CODE=$(curl -k -s -o /dev/null -w "%{http_code}" \
                  --connect-timeout 3 --max-time 5 \
                  --resolve "silver-trial.tail042f54.ts.net:443:${PUBLIC_EDGE_IP}" \
                  "https://silver-trial.tail042f54.ts.net/health" 2>/dev/null || echo "000")

                if [ "$HTTP_CODE" = "200" ]; then
                  echo ">>> VERIFIED: External public Anycast Funnel is LIVE and serving HTTP 200! (Attempt ${i}/12) <<<"
                  VERIFIED=true
                  break
                else
                  echo "Edge propagation in progress (HTTP ${HTTP_CODE}). Awaiting edge convergence (${i}/12)..."
                  sleep 5
                fi
              done

              if [ "$VERIFIED" != "true" ]; then
                echo "::warning::Edge verification timed out after 60s. Node will continue serving as edge caches converge."
              fi
            else
              echo "::warning::Unable to resolve edge IP via DNS or Python resolver. Skipping direct IP verification."
            fi
          fi

      # =====================================================================
      # PHASE 4: 330m PRODUCTION SHIFT & WATCHDOG
      # =====================================================================
      - name: Production Shift & Handover Dispatch
        env:
          CLONE_PAT: ${{ secrets.CLONE_PAT }}
          NEXT_PAT: ${{ secrets.NEXT_PAT }}
          FALLBACK_PAT: ${{ secrets.FALLBACK_PAT }}
          RDP_PASS: ${{ github.event.inputs.rdp_password }}
          ENABLE_FUNNEL: ${{ github.event.inputs.enable_funnel }}
          CYCLE_COUNT: ${{ github.event.inputs.cycle_count }}
          TEST_HANDOVER: ${{ github.event.inputs.test_handover }}
        run: |
          echo "=== PHASE 4: Production Shift Active ==="
          HANDOVER_MINUTE=330
          if [ -n "$TEST_HANDOVER" ] && [ "$TEST_HANDOVER" -gt 0 ] 2>/dev/null; then
            echo ">>> TEST HANDOVER OVERRIDE: ${TEST_HANDOVER} minute(s) <<<"
            HANDOVER_MINUTE=$TEST_HANDOVER
          fi

          ELAPSED=0
          CONSECUTIVE_UNHEALTHY=0

          while [ $ELAPSED -lt $HANDOVER_MINUTE ]; do
            sleep 60
            ELAPSED=$((ELAPSED + 1))

            # Watchdog: XRDP port 3389
            if ! nc -z localhost 3389 2>/dev/null; then
              echo "[$(date +'%T')] Restarting XRDP..."
              sudo systemctl restart xrdp
            fi

            # Watchdog: AIStudioToAPI health check
            HEALTH=$(curl -s --connect-timeout 2 --max-time 3 http://localhost:7860/health 2>/dev/null || echo "")
            if echo "$HEALTH" | grep -q '"browserConnected":\s*true' || echo "$HEALTH" | grep -q '"status":\s*"ok"'; then
              CONSECUTIVE_UNHEALTHY=0
            else
              CONSECUTIVE_UNHEALTHY=$((CONSECUTIVE_UNHEALTHY + 1))
              echo "[$(date +'%T')] Warning: Service check failed (${CONSECUTIVE_UNHEALTHY}/3)"
              if [ $CONSECUTIVE_UNHEALTHY -ge 3 ]; then
                echo "[$(date +'%T')] ALERT: 3 consecutive failures. Restarting AIStudioToAPI container..."
                (cd the-vps/AIStudioToAPI && docker compose restart) || true
                CONSECUTIVE_UNHEALTHY=0
              fi
            fi

            if [ $((ELAPSED % 15)) -eq 0 ]; then
              echo "[$(date +'%T')] Shift Progress: ${ELAPSED}/${HANDOVER_MINUTE}m | Status: HEALTHY"
            fi
          done

          echo "=== HANDOVER THRESHOLD REACHED (Minute ${HANDOVER_MINUTE}) ==="
          REPOS=(
            "octo-drift/vps-relay"
            "pixel-forge6999/vps-relay"
            "void-runner1/vps-relay"
            "zenith-labs1/vps-relay"
            "aurora-byte1/vps-relay"
            "timber-code1/vps-relay"
          )
          CURRENT_INDEX=-1
          for i in "${!REPOS[@]}"; do
            if [ "${REPOS[$i]}" = "${GITHUB_REPOSITORY}" ]; then
              CURRENT_INDEX=$i
              break
            fi
          done
          [ $CURRENT_INDEX -eq -1 ] && CURRENT_INDEX=0

          NEXT_INDEX=$(( (CURRENT_INDEX + 1) % ${#REPOS[@]} ))
          FALLBACK_INDEX=$(( (CURRENT_INDEX + 2) % ${#REPOS[@]} ))
          PRIMARY_TARGET="${REPOS[$NEXT_INDEX]}"
          FALLBACK_TARGET="${REPOS[$FALLBACK_INDEX]}"
          NEXT_CYCLE=$((CYCLE_COUNT + 1))

          dispatch_runner() {
            local target="$1"
            local token="$2"
            for attempt in 1 2 3 4; do
              echo "Dispatch attempt $attempt to ${target}..."
              if GH_TOKEN="$token" gh workflow run rdp.yml \
                --repo "$target" \
                -f rdp_password="$RDP_PASS" \
                -f enable_funnel="$ENABLE_FUNNEL" \
                -f cycle_count="$NEXT_CYCLE" \
                -f retry_depth="0" \
                -f test_handover="${TEST_HANDOVER:-0}"; then
                echo "Successfully triggered workflow on ${target}."
                return 0
              fi
              sleep 15
            done
            return 1
          }

          sync_auth_tokens() {
            if [ -d "the-vps" ] && [ -n "$CLONE_PAT" ]; then
              echo "Checking for updated session tokens in auth folders..."
              (
                cd the-vps
                git config user.name "Silver-kun"
                git config user.email "silver-kun@users.noreply.github.com"
                git add AIStudioToAPI/auth* 2>/dev/null || true
                if ! git diff --cached --quiet; then
                  echo "Found updated auth tokens! Committing and pushing to main..."
                  git commit -m "Auto-refresh: update active session auth tokens [skip ci]" || true
                  # Pull newest remote changes to prevent non-fast-forward rejection
                  git pull --rebase -X theirs "https://${CLONE_PAT}@github.com/Silver-kun/THE-VPS-SET-UP.git" main 2>/dev/null || true
                  git push "https://${CLONE_PAT}@github.com/Silver-kun/THE-VPS-SET-UP.git" HEAD:main 2>/dev/null || true
                else
                  echo "No token changes detected in auth folders."
                fi
              ) || true
            fi
          }

          # Sync refreshed tokens right before dispatching the successor
          sync_auth_tokens

          if ! dispatch_runner "$PRIMARY_TARGET" "$NEXT_PAT"; then
            echo "Primary dispatch failed. Activating fallback: ${FALLBACK_TARGET}..."
            dispatch_runner "$FALLBACK_TARGET" "$FALLBACK_PAT" || echo "CRITICAL: All dispatches failed!"
          fi

          echo "Successor dispatched! Entering active standby serving loop (up to 25m)..."
          for wait_min in {1..25}; do
            sleep 60
            echo "[$(date +'%T')] Outgoing node active & serving traffic (standby +${wait_min}m)..."
          done

      # =====================================================================
      # PHASE 5: FINAL TEARDOWN SAFETY CHECK
      # =====================================================================
      - name: Final Teardown Safety Check
        if: always()
        env:
          CLONE_PAT: ${{ secrets.CLONE_PAT }}
        run: |
          echo "=== PHASE 5: Teardown & Deregistration ==="
          # Final sync of auth folders if modified before container termination
          if [ -d "the-vps" ] && [ -n "$CLONE_PAT" ]; then
            echo "Final sync: preserving latest session tokens..."
            (
              cd the-vps
              git config user.name "Silver-kun"
              git config user.email "silver-kun@users.noreply.github.com"
              git add AIStudioToAPI/auth* 2>/dev/null || true
              if ! git diff --cached --quiet; then
                git commit -m "Auto-refresh: final session token sync [skip ci]" || true
                git pull --rebase -X theirs "https://${CLONE_PAT}@github.com/Silver-kun/THE-VPS-SET-UP.git" main 2>/dev/null || true
                git push "https://${CLONE_PAT}@github.com/Silver-kun/THE-VPS-SET-UP.git" HEAD:main 2>/dev/null || true
              fi
            ) || true
          fi
          (cd the-vps/AIStudioToAPI 2>/dev/null && docker compose down -t 2) || true
          sudo tailscale down 2>/dev/null || true
          echo "Node shutdown clean. 'silver-trial' released."
