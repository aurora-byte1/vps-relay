name: Ubuntu VPS Relay Node

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: 'Password for RDP user (runner)'
        required: true
        default: 'P@ssw0rd12345!'
        type: string
      enable_funnel:
        description: 'Expose port 7860 via Tailscale Funnel / Serve'
        required: true
        default: true
        type: boolean
      cycle_count:
        description: 'Relay cycle counter'
        required: false
        default: '0'
        type: string

jobs:
  vps-relay:
    name: Provision Ubuntu VPS Relay Node
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Current Repository
        uses: actions/checkout@v4

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sudo sh

      - name: Restore Permanent Tailscale State & TLS Certs Cache
        env:
          STATE_B64: ${{ secrets.TAILSCALE_STATE_B64 }}
        run: |
          sudo mkdir -p /var/run/tailscale /var/lib/tailscale/certs
          if [ -n "$STATE_B64" ]; then
            echo "Restoring permanent Tailscale node identity and cached Let's Encrypt certificates..."
            echo "$STATE_B64" | base64 -d | sudo tar -xz -C /var/lib/tailscale/
            sudo chmod 600 /var/lib/tailscale/tailscaled.state 2>/dev/null || true
            sudo chmod 600 /var/lib/tailscale/certs/*.key 2>/dev/null || true
            sudo chmod 644 /var/lib/tailscale/certs/*.crt 2>/dev/null || true
            echo "Restored files:"
            sudo ls -la /var/lib/tailscale/
            sudo ls -la /var/lib/tailscale/certs/
          fi

      - name: Connect to Tailscale Network (silver-trial)
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          sudo systemctl start tailscaled
          # Connect with permanent state and --reset to claim hostname exclusively
          sudo tailscale up \
            --authkey="${TAILSCALE_AUTHKEY}" \
            --hostname="silver-trial" \
            --accept-routes \
            --reset
          echo "Tailscale active:"
          sudo tailscale status

      - name: Clone Private VPS Setup Repository
        env:
          CLONE_PAT: ${{ secrets.CLONE_PAT }}
        run: |
          git config --global user.name "Silver-kun"
          git config --global user.email "silver-kun@users.noreply.github.com"
          git clone https://${CLONE_PAT}@github.com/Silver-kun/THE-VPS-SET-UP.git the-vps
          echo "Cloned private repo files:"
          ls -la the-vps/

      - name: Configure XRDP & Desktop Environment
        env:
          RDP_PASS: ${{ github.event.inputs.rdp_password }}
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xrdp xfce4 xfce4-goodies
          echo "xfce4-session" > ~/.xsession
          echo "export GNOME_SHELL_SESSION_MODE=ubuntu" >> ~/.xsessionrc
          echo "export XDG_CURRENT_DESKTOP=XFCE" >> ~/.xsessionrc
          echo "runner:${RDP_PASS}" | sudo chpasswd
          sudo sed -i 's/allowed_users=console/allowed_users=anybody/' /etc/X11/Xwrapper.config 2>/dev/null || true
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp
          echo "XRDP listening on 3389."

      - name: Launch AIStudioToAPI Service
        run: |
          cd the-vps/AIStudioToAPI
          echo "Starting AIStudioToAPI with Docker Compose..."
          docker compose up -d --build || docker compose up -d

          for i in {1..30}; do
            if nc -z localhost 7860 2>/dev/null; then
              echo "AIStudioToAPI is up and listening on 7860!"
              break
            fi
            sleep 2
          done

      - name: Configure Tailscale Serve & Funnel (7860)
        if: ${{ github.event.inputs.enable_funnel == 'true' || github.event.inputs.enable_funnel == true }}
        run: |
          echo "Configuring Tailscale Serve & Funnel..."
          sudo tailscale serve --bg --https=7860 http://localhost:7860 || true
          sudo tailscale funnel --bg --https=443 http://localhost:7860 || sudo tailscale funnel --bg 7860 || true
          echo "Current status:"
          sudo tailscale serve status || true
          sudo tailscale funnel status || true

      - name: Workload Maintenance & Rotating Handover
        env:
          NEXT_PAT: ${{ secrets.NEXT_PAT }}
          FALLBACK_PAT: ${{ secrets.FALLBACK_PAT }}
          RDP_PASS: ${{ github.event.inputs.rdp_password }}
          ENABLE_FUNNEL: ${{ github.event.inputs.enable_funnel }}
          CYCLE_COUNT: ${{ github.event.inputs.cycle_count }}
        run: |
          echo "==========================================================="
          echo "  Node Active: ${GITHUB_REPOSITORY} (Cycle: ${CYCLE_COUNT})"
          echo "  Tailscale Hostname : silver-trial"
          echo "  Public Funnel URL  : https://silver-trial.tail042f54.ts.net"
          echo "  RDP Host / IP      : silver-trial:3389"
          echo "  RDP Username       : runner"
          echo "  AIStudio Local Port: 7860"
          echo "==========================================================="

          HANDOVER_MINUTE=345
          TEARDOWN_MINUTE=347
          SHUTDOWN_MINUTE=350
          ELAPSED=0

          while [ $ELAPSED -lt $HANDOVER_MINUTE ]; do
            sleep 60
            ELAPSED=$((ELAPSED + 1))

            if ! nc -z localhost 3389 2>/dev/null; then
              echo "[$(date +'%T')] Restarting XRDP..."
              sudo systemctl restart xrdp
            fi

            if [ $((ELAPSED % 15)) -eq 0 ]; then
              STATUS=$(docker inspect -f '{{.State.Status}}' aistudio-to-api 2>/dev/null || echo "not running")
              echo "[$(date +'%T')] Elapsed: ${ELAPSED}/${HANDOVER_MINUTE}m | AIStudioToAPI: ${STATUS}"
            fi
          done

          echo "==========================================================="
          echo "  HANDOVER THRESHOLD REACHED (Minute 345)"
          echo "  Calculating next ring successor..."
          echo "==========================================================="

          REPOS=(
            "octo-drift/vps-relay"
            "pixel-forge6999/vps-relay"
            "void-runner1/vps-relay"
            "zenith-labs1/vps-relay"
            "aurora-byte1/vps-relay"
            "timber-code1/vps-relay"
          )

          CURRENT_INDEX=-1
          for i in "${!REPOS[@]}"; do
            if [[ "${REPOS[$i]}" == "${GITHUB_REPOSITORY}" ]]; then
              CURRENT_INDEX=$i
              break
            fi
          done

          if [ $CURRENT_INDEX -eq -1 ]; then
            echo "Warning: Current repo not in ring list. Defaulting to index 0."
            CURRENT_INDEX=0
          fi

          NEXT_INDEX=$(( (CURRENT_INDEX + 1) % ${#REPOS[@]} ))
          FALLBACK_INDEX=$(( (CURRENT_INDEX + 2) % ${#REPOS[@]} ))
          PRIMARY_TARGET="${REPOS[$NEXT_INDEX]}"
          FALLBACK_TARGET="${REPOS[$FALLBACK_INDEX]}"
          NEXT_CYCLE=$((CYCLE_COUNT + 1))

          dispatch_runner() {
            local target="$1"
            local token="$2"
            for attempt in 1 2 3 4; do
              echo "Dispatch attempt $attempt to ${target}..."
              if GH_TOKEN="$token" gh workflow run rdp.yml \
                --repo "$target" \
                -f rdp_password="$RDP_PASS" \
                -f enable_funnel="$ENABLE_FUNNEL" \
                -f cycle_count="$NEXT_CYCLE"; then
                echo "Successfully triggered workflow on ${target}."
                return 0
              fi
              sleep 15
            done
            return 1
          }

          if ! dispatch_runner "$PRIMARY_TARGET" "$NEXT_PAT"; then
            echo "Primary dispatch to ${PRIMARY_TARGET} failed. Engaging fallback to ${FALLBACK_TARGET}..."
            dispatch_runner "$FALLBACK_TARGET" "$FALLBACK_PAT" || echo "Critical: All dispatches failed."
          fi

          echo "Waiting until Minute ${TEARDOWN_MINUTE} before yielding Tailscale hostname..."
          while [ $ELAPSED -lt $TEARDOWN_MINUTE ]; do
            sleep 60
            ELAPSED=$((ELAPSED + 1))
          done

          echo "Yielding Tailscale hostname 'silver-trial' for successor node..."
          cd the-vps/AIStudioToAPI 2>/dev/null && docker compose down || true
          sudo tailscale logout || true

          echo "Node dereferenced. Waiting for clean shutdown at Minute ${SHUTDOWN_MINUTE}..."
          while [ $ELAPSED -lt $SHUTDOWN_MINUTE ]; do
            sleep 60
            ELAPSED=$((ELAPSED + 1))
          done

      - name: Final Teardown Safety Check
        if: always()
        run: |
          sudo tailscale logout 2>/dev/null || true
