name: Generate & Backup Clean silver-trial State

on:
  workflow_dispatch:

jobs:
  cert-gen:
    runs-on: ubuntu-latest
    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sudo sh
          sudo systemctl start tailscaled

      - name: Connect to Tailscale (Clean silver-trial)
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          sudo tailscale up \
            --authkey="${TAILSCALE_AUTHKEY}" \
            --hostname="silver-trial" \
            --accept-routes \
            --reset
          echo "Tailscale active node info:"
          sudo tailscale status

      - name: Issue TLS Certificate for silver-trial
        run: |
          sudo mkdir -p /var/lib/tailscale/certs
          sudo tailscale cert --cert-file=/var/lib/tailscale/certs/silver-trial.tail042f54.ts.net.crt --key-file=/var/lib/tailscale/certs/silver-trial.tail042f54.ts.net.key silver-trial.tail042f54.ts.net
          echo "Certificate files generated:"
          sudo ls -la /var/lib/tailscale/certs/

      - name: Export & Archive Tailscale State as Base64
        id: export
        run: |
          sudo systemctl stop tailscaled || true
          B64_STATE=$(sudo tar -czf - -C /var/lib/tailscale . | base64 -w 0)
          echo "Archive generated. Character count: $(echo -n "$B64_STATE" | wc -c)"
          # Write to artifact file
          echo "$B64_STATE" > /tmp/tailscale_state.b64

      - name: Upload State Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-state-b64
          path: /tmp/tailscale_state.b64
          retention-days: 1
